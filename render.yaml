services:
  - type: web
    name: mywallet-pilot
    branch: main
    runtime: docker
    plan: free
    dockerContext: .
    dockerfilePath: ./Dockerfile
    healthCheckPath: /ready
    envVars:
      - key: PORT
        value: '10000'
      - key: SUPABASE_URL
        value: https://hlcrjoqmyohfbajvafhh.supabase.co
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: RUNTIME_DATABASE_URL
        sync: false
      - key: DOCS_ENABLED
        value: 'false'
